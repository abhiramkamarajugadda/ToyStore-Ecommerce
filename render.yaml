# Render Blueprint: New > Blueprint > pick this repo. Values marked sync: false are typed
# into the Render dashboard (never committed). The database is a free Aiven MySQL service.
services:
  - type: web
    name: toystore-ecommerce
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /products
    envVars:
      # jdbc:mysql://<aiven-host>:<port>/defaultdb?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Razorpay TEST mode keys (rzp_test_...)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Random admin password generated by Render; read it from the dashboard
      - key: ADMIN_PASSWORD
        generateValue: true
      # Render free blocks outbound SMTP, so welcome emails stay off
      - key: MAIL_ENABLED
        value: "false"
      # Public URL used in links, e.g. https://toystore-ecommerce.onrender.com
      - key: APP_BASE_URL
        sync: false
