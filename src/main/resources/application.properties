spring.application.name=jspwithboot
spring.mvc.view.prefix = /WEB-INF/views/
spring.mvc.view.suffix=.jsp



# Database: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD win if set (Render + Aiven),
# otherwise DB_URL / DB_USERNAME / DB_PASSWORD, otherwise a local MySQL.
# Aiven example: jdbc:mysql://HOST:PORT/defaultdb?sslMode=REQUIRED
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecomtoy}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.driver-class-name:com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto:update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

razorpay.key=${RAZORPAY_KEY_ID:}
razorpay.secret=${RAZORPAY_KEY_SECRET:}


# Mail is off by default (Render free blocks SMTP). Set MAIL_ENABLED=true to send welcome emails.
app.mail.enabled=${MAIL_ENABLED:false}
app.base-url=${APP_BASE_URL:http://localhost:8081}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

server.port=${PORT:8081}
server.forward-headers-strategy=framework

# Demo accounts seeded on first start. ADMIN_PASSWORD should be set (Render generates one).
app.demo.admin-password=${ADMIN_PASSWORD:admin123}
app.demo.user-password=${DEMO_USER_PASSWORD:user123}

file.upload-dir=${UPLOAD_DIR:uploads/images/}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
