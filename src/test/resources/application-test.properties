# Test profile: in-memory H2 instead of MySQL, dummy gateway and mail settings.
spring.datasource.url=jdbc:h2:mem:toystore-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
razorpay.key=rzp_test_dummy
razorpay.secret=test_secret_for_unit_tests
spring.mail.host=localhost
